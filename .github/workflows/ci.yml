name: CI
on: [push, pull_request]
jobs:
    php:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.5']
                db: [sqlite, mysql, pgsql]
        services:
            postgres:
                image: postgres
                ports:
                    - 5432:5432
                env:
                    POSTGRES_PASSWORD: postgres
        steps:
            - uses: actions/checkout@v4
            - name: Setup MySQL
              if: matrix.db == 'mysql'
              run: |
                  sudo service mysql start
                  mysql -h 127.0.0.1 -u root -proot -e 'CREATE DATABASE cakephp;'
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '${{ matrix.php }}'
                  coverage: none
                  extensions: mbstring, intl, sqlite3, openssl, pdo_${{ matrix.db }}
                  ini-values: zend.assertions=1
            - name: Cache composer
              uses: actions/cache@v5
              with:
                  path: ~/.composer/cache
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
            - run: composer install --no-progress --no-interaction
            - name: Run PHPUnit
              run: |
                  if [[ ${{ matrix.db }} == 'sqlite' ]]; then export DB_URL='sqlite:///:memory:'; fi
                  if [[ ${{ matrix.db }} == 'mysql' ]]; then export DB_URL='mysql://root:root@127.0.0.1/cakephp'; fi
                  if [[ ${{ matrix.db }} == 'pgsql' ]]; then export DB_URL='postgres://postgres:postgres@127.0.0.1/postgres'; fi
                  vendor/bin/phpunit
            - if: matrix.db == 'sqlite'
              run: vendor/bin/phpstan analyse
            - if: matrix.db == 'sqlite'
              run: vendor/bin/phpcs
